---
# tasks file for infra.ansible_release_engineering.app_server

- name: Install Packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ app_server_jre_package }}"
    - "{{ 'firewalld' if app_server_firewalld_enabled | bool else omit }}"

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_server_app_group }}"
    system: true
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_server_app_user }}"
    group: "{{ app_server_app_group }}"
    home: "{{ app_server_app_dir }}"
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_server_app_dir }}"
    state: directory
    owner: "{{ app_server_app_user }}"
    group: "{{ app_server_app_group }}"
    mode: "0755"

- name: Download application jar
  ansible.builtin.get_url:
    url: "{{ app_server_app_url }}"
    dest: "{{ app_server_app_dir }}/{{ app_server_app_jar }}"
    owner: "{{ app_server_app_user }}"
    group: "{{ app_server_app_group }}"
    mode: "0644"
  notify: Restart app

- name: Write application version file
  ansible.builtin.copy:
    content: "{{ app_server_app_version }}"
    dest: "{{ app_server_app_dir }}/.app_version"
    owner: "{{ app_server_app_user }}"
    group: "{{ app_server_app_group }}"
    mode: "0644"

- name: Deploy systemd unit file
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart app

- name: Enable and start app service
  ansible.builtin.systemd_service:
    name: app
    state: started
    enabled: true

- name: Configure firewalld
  when: app_server_firewalld_enabled | bool
  block:
    - name: Ensure firewalld service is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open firewalld port for application
      ansible.posix.firewalld:
        port: "{{ app_server_app_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

- name: Wait for application health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_server_app_port }}{{ app_server_app_health_path }}"
    status_code: 200
  register: app_server_health_check
  until: app_server_health_check.status == 200
  retries: 30
  delay: 5
...
