---
# tasks file for infra.ansible_release_engineering.app_server

- name: Validate deployment mode
  ansible.builtin.assert:
    that:
      - app_server_deployment_mode in ['jar', 'container']
    fail_msg: >-
      app_server_deployment_mode must be 'jar' or 'container',
      got '{{ app_server_deployment_mode }}'

- name: Include tasks for {{ app_server_deployment_mode }} deployment mode # noqa: name[template]
  ansible.builtin.include_tasks: "deploy_{{ app_server_deployment_mode }}.yml"

- name: Configure firewalld
  when: app_server_firewalld_enabled | bool
  block:
    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Ensure firewalld service is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open firewalld port for application
      ansible.posix.firewalld:
        port: "{{ app_server_app_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

- name: Wait for application health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_server_app_port }}{{ app_server_app_health_path }}"
    status_code: 200
  register: app_server_health_check
  until: app_server_health_check.status == 200
  retries: 30
  delay: 5
...
