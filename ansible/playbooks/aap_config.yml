---
# AAP CaC playbook.
#
# Usage:
#   ansible-playbook -i ansible/inventory.yml ansible/playbooks/aap_config.yml -e "cac_ssh_private_key_file=/path/to/private/key"

- name: Playbook to configure AAP
  hosts: aap
  connection: local
  gather_facts: false
  tasks:
    - name: Include common vars
      ansible.builtin.include_vars:
        dir: ../config
        extensions:
          - 'yml'

    - name: Call dispatch role
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch


...
